
services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openptt
      POSTGRES_PASSWORD: openptt_secret
      POSTGRES_DB: openptt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openptt"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for floor control and sessions
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # OpenPTT Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8443:8443"   # HTTP/WebSocket
      - "9000:9000/udp"  # Audio UDP
    environment:
      OPENPTT__DATABASE__URL: "postgres://openptt:openptt_secret@postgres:5432/openptt"
      OPENPTT__REDIS__URL: "redis://redis:6379"
      OPENPTT__AUTH__JWT_SECRET: "change-this-in-production-to-a-very-long-random-string!!"
      RUST_LOG: "openptt_server=info,tower_http=info"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
